name: Deploy GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - name: Fetch PMTiles basemap (release assets, each < 100 MB)
        run: gh release download basemap-tiles -R "$GITHUB_REPOSITORY" -p '*.pmtiles' -D app/tiles --clobber
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: node scripts/build-static.mjs
        working-directory: app
        env: { BASE: "/${{ github.event.repository.name }}", SITE: "https://${{ github.repository_owner }}.github.io" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
